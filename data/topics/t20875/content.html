<p>因為個人操作習慣，比較喜歡指令式操作方式，「對話介面」點來點去很費時，關於ARRAY指令，預設方式可以加上「-」號，就是輸入-ARRAY指令，然後就變成指令式操作(無對話介面)。</p>
<p>寫了一個簡單的小程式，可以輸入AR2 ~ AR9指令，分別陣列2 ～9個數，其他個數請輸入ARN指令。</p>
<p>PS:另外指令式的好處可以支援「腳本檔」來批次處理喔～</p>
