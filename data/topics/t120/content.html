<p>加入(A)：切換為「加入」方式：可使用任何物件選取方式，將所選物件加入選集。</p>
<p>移除(R)：切換為「移除」方式：可使用任何物件選取方式，將物件從目前選集中移除。</p>
<p>PS:關於移除您可以使用另一種方法來代替「移除」模式，即在選取物時按住 SHIFT 鍵再選取物件及變成移除模式，以後就不需要 切換 加入(A)及移除(R)。</p>
