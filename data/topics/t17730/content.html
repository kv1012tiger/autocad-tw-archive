<p><b>※配置應用工具列：</b></p>
<img src="images/01.png" alt="" loading="lazy">
<div class="section-title">工具按鈕說明</div>
<p>[刪除頁面設置]DPagesetup指令：刪除目前圖面中所有頁面設置。</p>
<p>[指定頁面設置]MPagesetup指令：指定目前圖面中目前頁面設置。</p>
<p>[多配置轉單一配置]Layout2Dwg指令：圖面中所有多配置，匯出單一配置至新圖面(DWG)的配置空間。</p>
<p>[多配置轉單一模型]Layout2Model指令：圖面中所有多配置，匯出單一配置至新圖面(DWG)的模型空間。</p>
