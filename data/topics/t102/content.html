<p>一般在算數量時，重疊的物件會照成極大的誤差，建議你使用 Express 工具的 OVERKILL指令來快速清除 重疊的物件，然後再透過 按住[Ctrl]鍵進行物件循環選取。</p>
<p>PS:AutoCAD 2007 的 循環選取功能改為 [shift + 空白鍵]。</p>
<p>動態操作如下，有問題請再提~</p>
<p>1.Express OVERKILL指令運用，此線段有6個物件重疊，選取後5個物件刪除。</p>
<img src="images/01.png" alt="" loading="lazy">
<p>2.選取時請 按住[Ctrl]鍵 進行物件循環選取模式，紅、黃、綠、藍物件循環直到所選物件亮顯後按 Enter 即可。</p>
