<p><b>腳本檔(SCR)語法:</b></p>
<p>ROTATE = 旋轉指令</p>
<p>G = 物件選取；使用群組方式</p>
<p>長針 = 群組名稱</p>
<p>0,0 = 時鐘圓心座標</p>
<p>-1 = 順時針旋轉1度</p>
<p>rscript = 重複腳本檔</p>
