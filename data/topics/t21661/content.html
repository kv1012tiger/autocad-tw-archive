<p>AutoCAD的選項等設定，一般都是透面介面操作！</p>
<p>舉例來說：當使用者變更「物件鎖點 OSNAP」設置時，其實可以透過「系統變數」來改變「物件鎖點」。</p>
<p>所以只要在指令行中輸入 OSMODE系統變數，然後輸入我自己的設定值 5183 ，就可以立即完成以下「物件鎖點」設置：</p>
<img src="images/02.png" alt="" loading="lazy">
<p>舉凡「十字游標大小」、「選取框大小」等設置，都可以透過系統變數來直接修改！</p>
<p>快來看看還有哪些系統變數吧！</p>
