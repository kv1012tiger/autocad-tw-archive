<p>如果標註文字時文字字高一直無法顯示，可能原因為你設定了 文字型式(STYLE) 的字高，雖然說 標柱型式(DIMSTYLE) 也有字高，但是主要還是由 文字型式(STYLE) 地字高設定為準，只要將字高設定為 0 即可。</p>
