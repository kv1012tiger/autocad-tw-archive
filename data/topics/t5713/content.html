<p><b>說明：</b>範例圖塊的交換空間，資料夾為C槽下的TMP，檔名為TP1。</p>
<p><b>圖塊(0,0)巨集:</b></p>
<p>^C^Cselect;\-WBLOCK C:/TMP/TP1 Y ;0,0 p;;</p>
<p><b>插入(0,0)巨集:</b></p>
<p>^C^CINSUNITSDEFSOURCE;0;INSUNITSDEFTARGET;0;-INSERT *C:/TMP/TP1 0,0 ;;</p>
