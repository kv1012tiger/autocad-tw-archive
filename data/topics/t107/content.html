<div class="section-title">平滑視圖轉移特效關閉方式</div>
<p>此技術為 AutoCAD 2006 的平滑視圖轉移特效。可以在平移和縮放、變更視圖角度使用平滑視圖轉移特效。</p>
<p>請按照以下方式來關閉平滑視圖轉移特效。有問題請再提~</p>
<p>※※※ AutoCAD 2006 以上版本 ※※※</p>
<p>1.請輸入 VTOPTIONS 指令 螢幕上將顯示「視圖轉移」對話方塊。</p>
<p>2.將 □平移與縮放時啟用動畫 ....打勾取消即可。</p>
<p>PS:也可以直接將 VTENABLE系統變數 設定為0及可關閉</p>
