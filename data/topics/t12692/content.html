<p><b>關於在指令視窗中輸入指令</b>：</p>
<p>指令行會是告知使用者，程式可以執行什麼的指示。透過可停靠且可調整大小的指令視窗接受指令及系統變數，並顯示提示來協助使用者完成指令序列。</p>
