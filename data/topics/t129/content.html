<p>&quot;聽說畫AutoCAD用的螢幕不能用寬螢幕&quot; ←←← 這是錯誤的資訊</p>
<p>換成寬螢幕後只要調成正確的解析度即可，若調成不適合的解析度是會造成圓被壓扁的狀況。</p>
<p>以下為適當的解析度供你參考:</p>
<p>■「ViewSonic 17吋」液晶螢幕(一般) → 解析度為 1280 x 1024 像素</p>

<p>■「ViewSonic 19吋」液晶螢幕(寬) → 解析度為 1440 x 900 像素</p>
