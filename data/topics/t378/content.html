<p>一般使用AutoCAD來繪圖，應該知道圖層的重要性，但是一個大型專案往往有非常多的圖層，從2007以後的版本整合了Express工具中的「圖層漫遊」laywalk指令，並正式支持為內建指令也就是不用安裝Express工具即可使用，但是2006以下版本仍需藉助Express工具喔~</p>
<p>透過 圖層漫遊 這個功能，即可快速在圖面中動態顯示圖層，另外在範例中也提供了 圖層隔離 layiso指令，即可隱藏或鎖護除選取的物件所在圖層外的所有圖層。</p>
