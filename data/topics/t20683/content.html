<div class="section-title">「輔助建構線」工具列</div>
<div class="section-title">工具按鈕說明</div>
<p>[水平建構線]XLineH指令：連續建立水平建構線。</p>
<p>[垂直建構線]XLineV指令：連續建立垂直建構線。</p>
<p>[十字建構線]XLineXY指令：連續建立十字建構線。</p>
<p>[角度建構線]XLineA指令：連續建立角度建構線。</p>
<p>[刪除建構線]XLineDel指令：刪除全部建構線。</p>
