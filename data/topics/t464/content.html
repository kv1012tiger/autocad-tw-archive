<p>在家族的某一篇文章中，有人開玩笑的說 &quot;寫LISP像是笨蛋一樣...&quot;</p>
<p>嗯...有點認同，而我現在都不太寫了，因為公司的工具開發的差不多，不常用真的會忘掉呢~</p>
<p>關於寫LISP是不是笨蛋~我想就見仁見智囉~</p>
<p>而LISP是另一個層次的輔助工具，只不過職場上老闆不會要求你學，因為很少有老闆懂這個，而老板的要求很簡單，只要你能將手稿繪製成圖檔，最後再依比例出圖，我想就可以了，但是因為太多人都會，所以取代性很高，當你可以使用LISP來提昇工作效率，老闆看在眼哩，雖不敢說會調你薪水，但至少不會輕易把你換掉，也就是提升所謂的職場競爭力~</p>
<p>所以應該說學LISP是最聰明的笨蛋吧~</p>
