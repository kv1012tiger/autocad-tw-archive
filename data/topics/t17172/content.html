<p><b>※新功能說明</b>：</p>
<p>1.將「檔案頁籤」置於繪製區的頂部。</p>
<p>2.提供的簡便方式讓您存取應用程式中所有開啟的圖面。</p>
<p>3.檔案頁籤最右邊的加號按鈕會顯示「選取樣板」對話方塊以建立新圖面。</p>
<p><b>註</b>：</p>
<p>FILETABPREVIEW (系統變數)：控制當您將游標懸停在檔案頁籤上時的預覽類型(清單檢視或縮圖檢視)。</p>
<p>FILETABTHUMBHOVER (系統變數)：控制是否要將相應的模型或配置載入至圖面視窗。</p>
