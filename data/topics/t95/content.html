<div class="section-title">影像檔貼附到AutoCAD方式◆</div>
<p>請使用 影像管理員(IMAGE 指令) 連結影像檔到目前圖面，即可滿足你的需求。</p>
<p>並可以檢視影像詳細資料 ，例如像素寬度、顏色深度，以及選定的影像之解析度。</p>
<p>※以下為動態操作步驟，有問題請再提※</p>
<p>「插入」功能表：→「點陣式影像」→ 選擇JPG檔</p>
<img src="images/01.gif" alt="" loading="lazy">
<p>而且還可以裁切影像檔，並重新定義新的影像檔範圍。</p>
<p>「快顯功能表」→「影像」→ 「截取」→ 重新定義邊界</p>
