<p>相信各位朋友對 物件鎖點 並不陌生吧，我們都知道可以透過 OSNAP指令 來設定 常駐式物件鎖點，但是有時候圖面上的物件過於複雜，常常會抓不到你要的鎖點格式，此時提供一個小技巧，如果您已設定一個以上的常駐式物件鎖點，可以按 Tab鍵 以在特定物件的所有可用物件鎖點之間循環。</p>
<p>PS:或許你已知道這個方法，也請分享給你週遭的朋友吧~</p>
<p>※秘訣※</p>
<p>■當使用者下達指令時，指令行提示&quot;指定第一點:&quot; → 請移動滑鼠到目標區上方此時會開始自動鎖點 → 連續按下鍵盤的 Tab鍵 循環物件鎖點 → 直到出現想要的鎖點格式再按下滑鼠左鍵指定即可。</p>
