<p>公司在交流圖檔配合時需考量清楚圖層使用，才不會造成彼此的困擾，通常我是建議圖塊可以使用0層來建立，這樣一來就不會有新增很多圖層的困擾，未來在插入圖塊時會根據目前層來插入，這樣就不會增加很多不需要的圖層。</p>
