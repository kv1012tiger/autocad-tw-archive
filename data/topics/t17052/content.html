<p>DANDYYEUNG 寫到:我每次轉換做3D 格式的時候, 外掛程式列就好像被人掉出家門, 當我回到普通格式的時候我要一個一個放好他，你有沒有解決方法。</p>
<p>關於顧問外掛程式的工具，可以透過 <b>新增工作區（儲存）</b>。</p>
<p>1.開啟「<b>工作區</b>」設置，設定為「<b>自動儲存工作區設定</b>」。</p>
<p>2.再來把工具列擺放好位置。</p>
<p>3.另存一組「<b>工作區</b>」名稱，這樣以後切換「<b>工作區</b>」設置就不會跑掉。</p>
