<p><b>問：</b>如何在AutoCAD中寫出空心字呢？</p>
<p><b>答：</b>1.需要用空心字的字體，我用了這三個大字體</p>
<p>rubonm.shx</p>
<p>omv.shx</p>
<p>oli.shx</p>
<p>2.如果沒有字體，可用Express工具的「文字分解TXTEXP指令」，將文字分解為 2D線段。</p>
