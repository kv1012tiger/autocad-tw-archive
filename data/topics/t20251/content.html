<p>不知道大家使用AutoCAD做什麼呢？</p>
<p>這是我的工作用軟體，平時繪製結構圖說！</p>
<p>簡單說就是建築師設計建築外觀（如幾層樓多少面積等等）...</p>
<p>結構技師則設計計算需要用多大的柱子及梁，進而決定鋼筋用量或鋼骨型鋼尺寸大小！</p>
<p>舉例：建築師設計「人」的高矮胖瘦，結構技師決定這個「人」的骨頭粗細，這樣「人」才能穩穩的站立著。</p>
<p>另外，「人」的神經系統就由機電技師(水電及消防技師)來決定。</p>
<p>所以結構是最重要的環節之一，當然前線的現場監造施工也非常重要！！</p>
<p>好的設計也要按圖施工不得馬虎啊～</p>
<p>最後AutoCAD也是我分享知識及教學研討用的軟體呢！</p>
