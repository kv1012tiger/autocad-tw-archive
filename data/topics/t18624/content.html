<div class="section-title">選取物件：</div>
<p>自動為您選取的物件選取適用的標註類型，並顯示與該標註類型對應的提示。</p>
<div class="section-title">DIMLAYER (系統變數)：</div>
<p>指定新標註的預設圖層。</p>
<div class="section-title">標註移開</div>
<p>將既有標註及新插入的標註排列成基線式標註類型。</p>
<div class="section-title">標註切斷</div>
<p>將既有標註分割成兩個標註，然後將標註排列成連續標註類型。</p>
<div class="section-title">標註取代</div>
<p>刪除既有標註，然後以您插入的標註取代。</p>
