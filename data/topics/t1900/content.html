<div class="callout callout--note"><b>問題</b>收到一張由客戶傳來的模型圖，打開檔案總共有四個小縮圖在一張文件上，請問如何分割成一個一個圖，並放大可列印出來？</div>
<p>出圖的方式有很多種，依照您的需求我想配置出圖比較適合，請先參考以下範例影片方式。</p>
<ul class="step-list"><li><div class="step-num">1</div><div>切換到配置空間。</div></li><li><div class="step-num">2</div><div>建立頁面設定：請選擇正確出圖設備及正確比例。</div></li><li><div class="step-num">3</div><div>建立四等分視埠。</div></li><li><div class="step-num">4</div><div>開啟視埠工具列，定義各視埠比例。</div></li><li><div class="step-num">5</div><div>出圖。</div></li></ul>
