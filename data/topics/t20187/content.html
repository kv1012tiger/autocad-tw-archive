<p>大家好：</p>
<p>繪圖時常常需要局部剖面詳圖，常常要修減掉不要的部份，一般步驟雖不多但總覺得有點累...</p>
<p>所以想透過「Express工具」EXTRIM指令，然後寫成連續指令巨集！</p>
<p>立馬可省下一些步驟，如果你覺得有幫助就快來自訂工具按鈕吧！</p>
<p>PS:AutoCAD需已安裝Express。</p>
<div class="video-frame"><iframe src="https://www.youtube.com/embed/gBC0oVunNXc" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="section-title">矩形修剪連續指令巨集：</div>
<p>^C^CRECTANG;\\EXTRIM;L;\ERASE;L;;</p>
<div class="section-title">圓形修剪連續指令巨集：</div>
<p>^C^CCIRCLE;\\EXTRIM;L;\ERASE;L;;</p>
