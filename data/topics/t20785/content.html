<p>大家好：</p>
<p>分享LISP大師 Lee Mac 一個有趣的LISP程式！</p>
<p>我繪製了一個簡單的曲線(雲形線)，然後指定圖面文字或輸入文字，再選擇曲線即可文字貼齊曲線，而且可以跟著滑鼠動態展示～</p>
<p>註：僅支援英文及數字，不支持中文字體。</p>
<p>想要玩的朋友可以來論壇下載喔^_^</p>
<p>程式作者 Lee Mac 提供：<a href="http://lee-mac.com/index.html" target="_blank" rel="noopener">http://lee-mac.com/index.html</a></p>

<p>代碼:</p>
<p>指令: CURVETEXT</p>
<p>輸入文字或選擇文字:</p>
<p>選取曲線:</p>
<p>Position Text: [+/-] Offset, [&lt;/&gt;] Spacing</p>
