<p>關於聚合線</p>
<p>有一些弧線和線條的圖形要如何做聚合線</p>
<p>試了都不成功</p>
<p>Q3:關於聚合線...</p>
<p>請使用「聚合線編輯」PEDIT指令 可以將一條線、弧或另一聚合線接合為一個開放聚合線，線與弧之間不能有間距(空隙)。多重物件請使用 [多重(M)]選項。</p>
<p>動態操作如下，有問題請再提~</p>
<div class="video-frame"><iframe src="https://www.youtube.com/embed/63ydVBZo7Jk" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<p>如果線與弧之間有間距(空隙)。多重物件請使用 [多重(M)]選項 &gt;&gt; 接合(J) &gt;&gt; 輸入 連綴距離(適當值)</p>
