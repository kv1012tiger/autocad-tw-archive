<p>關於在修剪及延伸指令作時，有時會在修剪指令有問題,會因為畫面上其他線而被干擾無法一次剪完，原因如下:</p>
<p>在修改指令 延伸(EXTEND)及修剪(TRIM) 的 邊緣(E) 副選項，可以控制決定切割邊緣與邊界邊緣的方式，也可以透過 EDGEMODE系統變數 來控制假想延伸線，所以請輸入 EDGEMODE系統變數 並設定為 0 即可解決你的問題。</p>
