<p>在「模型」頁籤上，可將繪圖區分割為一個或多個稱為模型空間視埠的相鄰矩形視圖。</p>
<p>視埠是顯示模型不同視圖的區域。在「模型」頁籤上，您可以將繪圖區分割為一個或多個稱為模型空間視埠的相鄰矩形視圖。在大而複雜的圖面中，顯示不同的視圖可以減少在單一視圖中需要進行縮放和平移的時間。而且，您在某個視圖中可能遺漏的錯誤可能會在其它的視圖中顯現。</p>
<p>在模型頁籤上建立的視埠完全填滿繪圖區而且沒有覆疊。在一個視埠中進行變更時，其它視埠中的圖形同時自動更新。圖解中展示了四個模型空間視埠。</p>
