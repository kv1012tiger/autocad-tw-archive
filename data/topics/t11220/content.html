<p>平時習慣使用「F10」極座標模式，依系統預設都有開啟「極座標追蹤向量」。</p>
<img src="images/01.png" alt="極座標追蹤向量設定" loading="lazy">
<p>之前有發現一個問題，一般當您畫線（LINE）的時候，「極座標追蹤向量」顯示會跟你畫的方向一樣。舉例：畫線第二點往右方 0 度移動，此時「極座標追蹤向量」綠色虛線會往右方 0 度無限延伸（如圖所示）。</p>
<img src="images/02.png" alt="正常情況：追蹤虛線往右方延伸" loading="lazy">
<p>但是有一張圖檔很怪，他的「極座標追蹤向量」綠色虛線卻是相反的往左方 180 度（如圖所示）。這個問題只存在某個圖檔，其他圖檔皆正常～</p>
<img src="images/03.png" alt="異常情況：追蹤虛線往左方延伸" loading="lazy">
<p>這個問題後來解決了，解法在論壇原文的討論中：<a href="https://www.autocad-tw.com/t11220-topic" target="_blank" rel="noopener">https://www.autocad-tw.com/t11220-topic</a></p>
