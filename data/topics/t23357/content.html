<p>分享自動轉圖塊+移動巨集指令，移動物件指定插入點後，自動轉換成預設「<b>隨機匿名圖塊</b>」名稱，事後有需要可以用「<b>RENAME指令</b>」更名圖塊名稱。</p>
<p>代碼:</p>
<p>^C^CSELECT;\COPYBASE;\P;;ERASE;P;;PASTEBLOCK;@;MOVE;l;;@;</p>
