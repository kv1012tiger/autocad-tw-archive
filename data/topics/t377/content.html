<p>以前CAD指令功能不熟練時，碰這開挖支撐圖須配置預壘樁(紅色部分)，常常會花掉很多時間，現在跟各位分享「測量」MEASURE指令的小技巧使用方式。</p>
<p>1.須先把預壘樁(紅色部分)製作成圖塊，圖塊名稱自訂。</p>
<p>2.接著使用MEASURE指令，使用圖塊來等距區間上放置預壘樁(紅色部分)。</p>
<p>PS:當使用MEASURE指令等距放置圖塊後，在些微調整圖塊即可輕鬆完成。</p>
