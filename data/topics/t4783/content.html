<p>巢狀與覆疊參考圖面：</p>
<p>所貼附的 DWG 參考 (外部參考) 可以是巢狀，亦即，您可以貼附包含其他外部參考的外部參考。</p>
<p>外部參考可以巢狀在其它外部參考內，也就是說，您可以貼附包含其它外部參考的外部參考。可以依需要貼附任意數目的外部參考複本，每個複本都可以具有不同的位置、比例和旋轉。</p>
