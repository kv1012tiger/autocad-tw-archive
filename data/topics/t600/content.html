<p>一般最快的方式是使用 AutoLISP程式來處理，但若沒有程式又無程式基礎，倒是可以使用一個小技巧來達到 橢圓轉弧(聚合線) 的效果喔!</p>
<p>1.請將 PELLIPSE系統變數 設定為 1 ，建立聚合線表現法的橢圓。</p>
<p>2.重新畫一次橢圓即可。</p>
